services:
  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    container_name: delega-app
    restart: unless-stopped
    environment:
      - WEBHOOK_SHARED_SECRET=${WEBHOOK_SHARED_SECRET:?defina no .env da VM, nunca commitado}
      - OPENAPI_KEY=${OPENAPI_KEY:?defina no .env da VM, nunca commitado}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-https://desafiozapi.py.tec.br}
    ports:
      - "127.0.0.1:8010:8000"
    dns:
      - 1.1.1.1
      - 8.8.8.8
    volumes:
      - /mnt/api-zapi-desafio-hackathon/data:/app/data
      - /mnt/api-zapi-desafio-hackathon/mcp_auth:/app/.mcp_auth

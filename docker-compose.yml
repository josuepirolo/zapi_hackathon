services:
  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    container_name: delega-app
    restart: unless-stopped
    environment:
      - WEBHOOK_SHARED_SECRET=${WEBHOOK_SHARED_SECRET:?defina no .env da VM, nunca commitado}
      - OPENAPI_KEY=${OPENAPI_KEY:?defina no .env da VM, nunca commitado}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-https://desafiozapi.py.tec.br}
      - NEXT_PUBLIC_TURNSTILE_SITE_KEY=${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
      - TURNSTILE_SECRET_KEY=${TURNSTILE_SECRET_KEY:-}
      - CHAT_RATE_LIMIT_PER_MINUTE=${CHAT_RATE_LIMIT_PER_MINUTE:-8}
      - CHAT_POLL_RATE_LIMIT_PER_MINUTE=${CHAT_POLL_RATE_LIMIT_PER_MINUTE:-90}
      - CHAT_ACCEPT_RATE_LIMIT_PER_MINUTE=${CHAT_ACCEPT_RATE_LIMIT_PER_MINUTE:-15}
      - ZAPI_INSTANCE_PHONE=${ZAPI_INSTANCE_PHONE:-5544998094320}
    ports:
      - "127.0.0.1:8010:8000"
    dns:
      - 1.1.1.1
      - 8.8.8.8
    volumes:
      - /mnt/api-zapi-desafio-hackathon/data:/app/data
      - /mnt/api-zapi-desafio-hackathon/mcp_auth:/app/.mcp_auth
